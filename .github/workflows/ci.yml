name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control plane and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Validate repository controls
        shell: pwsh
        run: ./scripts/verify.ps1

  java:
    name: Java business runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run clean Java gate
        shell: pwsh
        run: ./scripts/business-api.ps1 test

  python-contracts:
    name: Python compute and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run frozen Python and contract gate
        shell: pwsh
        run: ./scripts/compute-api.ps1 check

  web:
    name: Role-aware web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install Chromium for browser smoke
        shell: pwsh
        run: |
          Push-Location apps/web
          npm exec -- playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright browser installation failed" }
          Pop-Location
      - name: Run web static and unit gate
        shell: pwsh
        run: ./scripts/web.ps1 check
      - name: Run web browser smoke gate
        shell: pwsh
        run: ./scripts/web.ps1 e2e

  resilience:
    name: Bounded degradation and resilience
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run focused failure injection gate
        shell: pwsh
        run: ./scripts/resilience.ps1
