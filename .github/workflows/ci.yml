name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control plane and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - uses: azure/setup-helm@v4.3.0
        with:
          version: "v3.18.6"
      - name: Validate repository controls
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Validate Vultr Tokyo preparation without provider calls
        shell: pwsh
        run: ./scripts/r4_external_iac_gate.ps1

  java:
    name: Java business runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run clean Java gate
        shell: pwsh
        run: ./scripts/business-api.ps1 test
      - name: Generate dependency, SBOM, and OCI provenance evidence
        shell: pwsh
        run: ./scripts/supply-chain.ps1
      - name: Retain supply-chain evidence
        uses: actions/upload-artifact@v7
        with:
          name: r4-404-supply-chain-${{ github.sha }}
          path: evidence/tests/tmp/R4-404
          if-no-files-found: error
          retention-days: 30

  python-contracts:
    name: Python compute and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run frozen Python and contract gate
        shell: pwsh
        run: ./scripts/compute-api.ps1 check

  web:
    name: Role-aware web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install Chromium for browser smoke
        shell: pwsh
        run: |
          Push-Location apps/web
          npm exec -- playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright browser installation failed" }
          Pop-Location
      - name: Run web static and unit gate
        shell: pwsh
        run: ./scripts/web.ps1 check
      - name: Run web browser smoke gate
        shell: pwsh
        run: ./scripts/web.ps1 e2e

  resilience:
    name: Bounded degradation and resilience
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run focused failure injection gate
        shell: pwsh
        run: ./scripts/resilience.ps1
      - name: Run isolated backup and restore drill
        run: python scripts/disaster_recovery_drill.py
      - name: Retain recovery drill evidence
        uses: actions/upload-artifact@v7
        with:
          name: r4-406-local-recovery-${{ github.sha }}
          path: evidence/tests/tmp/R4-406/local-drill.json
          if-no-files-found: error
          retention-days: 30
