name: routemind

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routemind}
      POSTGRES_USER: ${POSTGRES_USER:-routemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - platform

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.5-management-alpine}
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-routemind}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me-local-only}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-15673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15674}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - platform

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.1-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-only}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
