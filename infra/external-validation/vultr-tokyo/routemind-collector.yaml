apiVersion: v1
kind: Service
metadata:
  name: routemind-otel-collector
  namespace: routemind-observability
  labels:
    app.kubernetes.io/name: routemind-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: routemind-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: health
      port: 13133
      targetPort: 13133
    - name: metrics
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: routemind-otel-collector
  namespace: routemind-observability
spec:
  serviceName: routemind-otel-collector
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: routemind-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routemind-otel-collector
        routemind.io/component: telemetry-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.159.0
          args: ["--config=/etc/otelcol/config.json"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: ROUTEMIND_TELEMETRY_OTLP_ENDPOINT
              value: https://routemind-signoz-otel-collector.routemind-observability.svc.cluster.local:4318
            - name: ROUTEMIND_TELEMETRY_RECEIVER_CA_FILE
              value: /var/run/routemind-collector-tls/ca.crt
            - name: ROUTEMIND_TELEMETRY_RECEIVER_CERT_FILE
              value: /var/run/routemind-collector-tls/receiver.crt
            - name: ROUTEMIND_TELEMETRY_RECEIVER_KEY_FILE
              value: /var/run/routemind-collector-tls/receiver.key
            - name: ROUTEMIND_TELEMETRY_EXPORTER_CA_FILE
              value: /var/run/routemind-collector-tls/ca.crt
            - name: ROUTEMIND_TELEMETRY_EXPORTER_CERT_FILE
              value: /var/run/routemind-collector-tls/exporter.crt
            - name: ROUTEMIND_TELEMETRY_EXPORTER_KEY_FILE
              value: /var/run/routemind-collector-tls/exporter.key
            - name: ROUTEMIND_TELEMETRY_METRICS_ADDRESS
              value: 0.0.0.0:8888
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
            - {name: metrics, containerPort: 8888}
          readinessProbe:
            httpGet: {path: /, port: health, scheme: HTTP}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /, port: health, scheme: HTTP}
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: tls
              mountPath: /var/run/routemind-collector-tls
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: routemind-otel-collector-config
        - name: tls
          secret:
            secretName: routemind-otel-collector-tls
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: vultr-block-storage
        resources:
          requests:
            storage: 10Gi
