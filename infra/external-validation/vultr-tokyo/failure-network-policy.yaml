apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inject-backend-network-outage
  namespace: routemind-observability
  labels:
    routemind.io/failure-injection: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: routemind-otel-collector
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
