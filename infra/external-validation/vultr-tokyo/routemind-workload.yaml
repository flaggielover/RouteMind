apiVersion: v1
kind: Namespace
metadata:
  name: routemind-app
  labels:
    routemind.io/external-validation: "true"
    routemind.io/data-residency: tokyo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: routemind-source
  namespace: routemind-app
data:
  repository: https://github.com/flaggielover/RouteMind.git
  revision: REPLACED_BY_CONTROLLER
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: routemind-app
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-required-flows
  namespace: routemind-app
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              routemind.io/external-validation: "true"
      ports:
        - {protocol: TCP, port: 18080}
        - {protocol: TCP, port: 18081}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: routemind-observability
      ports:
        - {protocol: TCP, port: 4318}
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: routemind-app
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: routemind-app
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          env:
            - {name: POSTGRES_DB, value: routemind}
            - {name: POSTGRES_USER, value: routemind}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: routemind-runtime-secrets, key: POSTGRES_PASSWORD}}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, routemind, -d, routemind]}, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: routemind-app
spec:
  selector: {app.kubernetes.io/name: rabbitmq}
  ports: [{name: amqp, port: 5672, targetPort: 5672}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: routemind-app
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rabbitmq}}
  template:
    metadata: {labels: {app.kubernetes.io/name: rabbitmq}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management-alpine
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: routemind}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: routemind-runtime-secrets, key: RABBITMQ_DEFAULT_PASS}}}
          ports: [{containerPort: 5672}]
          readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: routemind-app
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: routemind-app
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:8.10.1-alpine
          command: [sh, -ec]
          args: [exec redis-server --appendonly no --requirepass "$REDIS_PASSWORD"]
          env:
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: routemind-runtime-secrets, key: REDIS_PASSWORD}}}
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: [sh, -ec, 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG']}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: business-api
  namespace: routemind-app
spec:
  selector: {app.kubernetes.io/name: business-api}
  ports: [{name: http, port: 18080, targetPort: 18080}]
---
apiVersion: v1
kind: Service
metadata:
  name: compute-api
  namespace: routemind-app
spec:
  selector: {app.kubernetes.io/name: compute-api}
  ports: [{name: http, port: 18081, targetPort: 18081}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-api
  namespace: routemind-app
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: business-api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: business-api}}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: checkout
          image: alpine/git:2.47.2
          env:
            - {name: ROUTEMIND_SOURCE_REVISION, valueFrom: {configMapKeyRef: {name: routemind-source, key: revision}}}
          command: [sh, -ec]
          args: ["git clone --filter=blob:none --no-checkout https://github.com/flaggielover/RouteMind.git /src; cd /src; git fetch --depth=1 origin $ROUTEMIND_SOURCE_REVISION; git checkout --detach $ROUTEMIND_SOURCE_REVISION; test \"$(git rev-parse HEAD)\" = \"$ROUTEMIND_SOURCE_REVISION\""]
          volumeMounts: [{name: source, mountPath: /src}]
        - name: build
          image: maven:3.9.11-eclipse-temurin-17
          command: [sh, -ec]
          args: ["cd /src/services/business-api; mvn -B -ntp -DskipTests package; cp target/business-api-0.0.1-SNAPSHOT.jar /work/business-api.jar"]
          volumeMounts: [{name: source, mountPath: /src}, {name: work, mountPath: /work}]
      containers:
        - name: business-api
          image: eclipse-temurin:17-jre
          command: [java, -jar, /work/business-api.jar]
          env:
            - {name: ROUTEMIND_POSTGRES_URL, value: jdbc:postgresql://postgres:5432/routemind}
            - {name: POSTGRES_USER, value: routemind}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: routemind-runtime-secrets, key: POSTGRES_PASSWORD}}}
            - {name: RABBITMQ_HOST, value: rabbitmq}
            - {name: RABBITMQ_AMQP_PORT, value: "5672"}
            - {name: RABBITMQ_DEFAULT_USER, value: routemind}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: routemind-runtime-secrets, key: RABBITMQ_DEFAULT_PASS}}}
            - {name: REDIS_HOST, value: redis}
            - {name: REDIS_PORT, value: "6379"}
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: routemind-runtime-secrets, key: REDIS_PASSWORD}}}
            - {name: ROUTEMIND_TELEMETRY_ATTRIBUTION_KEY, valueFrom: {secretKeyRef: {name: routemind-runtime-secrets, key: ROUTEMIND_TELEMETRY_ATTRIBUTION_KEY}}}
            - {name: ROUTEMIND_EDGE_SECURITY_ENABLED, value: "false"}
            - {name: SPRING_APPLICATION_NAME, value: routemind-business-api}
            - {name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED, value: "true"}
            - {name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, value: https://routemind-otel-collector.routemind-observability.svc.cluster.local:4318/v1/traces}
            - {name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_SSL_BUNDLE, value: routemind}
            - {name: SPRING_SSL_BUNDLE_PEM_ROUTEMIND_TRUSTSTORE_CERTIFICATE, value: file:/var/run/routemind-tls/ca.crt}
            - {name: SPRING_SSL_BUNDLE_PEM_ROUTEMIND_KEYSTORE_CERTIFICATE, value: file:/var/run/routemind-tls/tls.crt}
            - {name: SPRING_SSL_BUNDLE_PEM_ROUTEMIND_KEYSTORE_PRIVATE_KEY, value: file:/var/run/routemind-tls/tls.key}
            - {name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE, value: health,info,prometheus}
          ports: [{containerPort: 18080}]
          readinessProbe: {httpGet: {path: /actuator/health, port: 18080}, periodSeconds: 10, failureThreshold: 12}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1, memory: 1Gi}}
          volumeMounts: [{name: work, mountPath: /work, readOnly: true}, {name: tls, mountPath: /var/run/routemind-tls, readOnly: true}]
      volumes:
        - {name: source, emptyDir: {sizeLimit: 2Gi}}
        - {name: work, emptyDir: {sizeLimit: 512Mi}}
        - {name: tls, secret: {secretName: routemind-app-tls}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-api
  namespace: routemind-app
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: compute-api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: compute-api}}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: checkout
          image: alpine/git:2.47.2
          env:
            - {name: ROUTEMIND_SOURCE_REVISION, valueFrom: {configMapKeyRef: {name: routemind-source, key: revision}}}
          command: [sh, -ec]
          args: ["git clone --filter=blob:none --no-checkout https://github.com/flaggielover/RouteMind.git /src; cd /src; git fetch --depth=1 origin $ROUTEMIND_SOURCE_REVISION; git checkout --detach $ROUTEMIND_SOURCE_REVISION; test \"$(git rev-parse HEAD)\" = \"$ROUTEMIND_SOURCE_REVISION\""]
          volumeMounts: [{name: source, mountPath: /src}]
        - name: install
          image: ghcr.io/astral-sh/uv:0.12.5-python3.13-bookworm-slim
          command: [sh, -ec]
          args: ["cd /src/services/compute-api; uv sync --frozen --no-dev"]
          volumeMounts: [{name: source, mountPath: /src}]
      containers:
        - name: compute-api
          image: ghcr.io/astral-sh/uv:0.12.5-python3.13-bookworm-slim
          command: [uv, run, --directory, /src/services/compute-api, uvicorn, routemind_compute.api.app:app, --host, 0.0.0.0, --port, "18081"]
          env:
            - {name: ROUTEMIND_OTLP_EXPORT_ENABLED, value: "true"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: https://routemind-otel-collector.routemind-observability.svc.cluster.local:4318}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_EXPORTER_OTLP_CERTIFICATE, value: /var/run/routemind-tls/ca.crt}
            - {name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE, value: /var/run/routemind-tls/tls.crt}
            - {name: OTEL_EXPORTER_OTLP_CLIENT_KEY, value: /var/run/routemind-tls/tls.key}
            - {name: OTEL_SERVICE_NAME, value: routemind-compute-api}
          ports: [{containerPort: 18081}]
          readinessProbe: {httpGet: {path: /healthz, port: 18081}, periodSeconds: 10, failureThreshold: 12}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1, memory: 2Gi}}
          volumeMounts: [{name: source, mountPath: /src, readOnly: true}, {name: tls, mountPath: /var/run/routemind-tls, readOnly: true}]
      volumes:
        - {name: source, emptyDir: {sizeLimit: 2Gi}}
        - {name: tls, secret: {secretName: routemind-app-tls}}
