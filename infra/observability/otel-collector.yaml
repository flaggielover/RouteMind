{
  "extensions": {
    "file_storage/telemetry_queue": {
      "directory": "/var/lib/otelcol/queue",
      "create_directory": true,
      "compaction": {
        "directory": "/var/lib/otelcol/queue",
        "on_start": true,
        "on_rebound": true
      }
    }
  },
  "receivers": {
    "otlp": {
      "protocols": {
        "grpc": {"endpoint": "0.0.0.0:4317"},
        "http": {"endpoint": "0.0.0.0:4318"}
      }
    },
    "prometheus": {
      "config": {
        "scrape_configs": [
          {
            "job_name": "routemind-business-api",
            "scrape_interval": "30s",
            "static_configs": [{"targets": ["business-api:18080"]}]
          },
          {
            "job_name": "routemind-compute-api",
            "scrape_interval": "30s",
            "static_configs": [{"targets": ["compute-api:18081"]}]
          }
        ]
      }
    }
  },
  "processors": {
    "memory_limiter": {
      "check_interval": "1s",
      "limit_mib": 384,
      "spike_limit_mib": 96
    },
    "attributes/tenant_safety": {
      "actions": [
        {"key": "routemind.tenant_id", "action": "delete"},
        {"key": "tenant.id", "action": "delete"},
        {"key": "enduser.id", "action": "delete"},
        {"key": "user.id", "action": "delete"},
        {"key": "courier.id", "action": "delete"},
        {"key": "principal.id", "action": "delete"}
      ]
    },
    "batch": {
      "timeout": "5s",
      "send_batch_size": 512,
      "send_batch_max_size": 1024
    }
  },
  "exporters": {
    "otlphttp/target": {
      "endpoint": "${env:ROUTEMIND_TELEMETRY_OTLP_ENDPOINT}",
      "headers": {
        "Authorization": "${env:ROUTEMIND_TELEMETRY_AUTHORIZATION}"
      },
      "timeout": "10s",
      "sending_queue": {
        "enabled": true,
        "num_consumers": 4,
        "queue_size": 4096,
        "storage": "file_storage/telemetry_queue"
      },
      "retry_on_failure": {
        "enabled": true,
        "initial_interval": "5s",
        "max_interval": "30s",
        "max_elapsed_time": "300s"
      }
    }
  },
  "service": {
    "extensions": ["file_storage/telemetry_queue"],
    "telemetry": {
      "metrics": {"address": "127.0.0.1:8888"}
    },
    "pipelines": {
      "traces": {
        "receivers": ["otlp"],
        "processors": ["memory_limiter", "attributes/tenant_safety", "batch"],
        "exporters": ["otlphttp/target"]
      },
      "metrics": {
        "receivers": ["otlp", "prometheus"],
        "processors": ["memory_limiter", "attributes/tenant_safety", "batch"],
        "exporters": ["otlphttp/target"]
      }
    }
  }
}
