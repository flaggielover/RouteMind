spring:
  application:
    name: business-api
  datasource:
    url: ${ROUTEMIND_POSTGRES_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:15432}/${POSTGRES_DB:routemind}}
    username: ${POSTGRES_USER:routemind}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_AMQP_PORT:15673}
    username: ${RABBITMQ_DEFAULT_USER:routemind}
    password: ${RABBITMQ_DEFAULT_PASS:change-me-local-only}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:change-me-local-only}
  flyway:
    create-schemas: true
    default-schema: routemind
    schemas: routemind
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: routemind
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${BUSINESS_API_PORT:18080}
  shutdown: graceful

management:
  opentelemetry:
    enabled: ${ROUTEMIND_OTEL_ENABLED:true}
    resource-attributes:
      service.namespace: routemind
    tracing:
      export:
        otlp:
          enabled: ${ROUTEMIND_OTLP_EXPORT_ENABLED:false}
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${ROUTEMIND_TRACE_SAMPLE_PROBABILITY:1.0}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [trace_id=%X{trace_id:-none} request_id=%X{request_id:-none}]"

routemind:
  security:
    edge:
      enabled: ${ROUTEMIND_EDGE_SECURITY_ENABLED:true}
      policy-version: ${ROUTEMIND_EDGE_POLICY_VERSION:edge-v1}
      window-seconds: ${ROUTEMIND_EDGE_WINDOW_SECONDS:60}
      burst-allowance: ${ROUTEMIND_EDGE_BURST_ALLOWANCE:20}
      anonymous-requests: ${ROUTEMIND_EDGE_ANONYMOUS_REQUESTS:60}
      authenticated-requests: ${ROUTEMIND_EDGE_AUTHENTICATED_REQUESTS:120}
      customer-requests: ${ROUTEMIND_EDGE_CUSTOMER_REQUESTS:180}
      courier-requests: ${ROUTEMIND_EDGE_COURIER_REQUESTS:300}
      merchant-requests: ${ROUTEMIND_EDGE_MERCHANT_REQUESTS:240}
      analyst-requests: ${ROUTEMIND_EDGE_ANALYST_REQUESTS:300}
      operator-requests: ${ROUTEMIND_EDGE_OPERATOR_REQUESTS:600}
      max-tracked-keys: ${ROUTEMIND_EDGE_MAX_TRACKED_KEYS:10000}
      max-header-count: ${ROUTEMIND_EDGE_MAX_HEADER_COUNT:64}
      max-header-bytes: ${ROUTEMIND_EDGE_MAX_HEADER_BYTES:16384}
      max-query-bytes: ${ROUTEMIND_EDGE_MAX_QUERY_BYTES:4096}
      max-path-bytes: ${ROUTEMIND_EDGE_MAX_PATH_BYTES:2048}
      max-body-bytes: ${ROUTEMIND_EDGE_MAX_BODY_BYTES:1048576}
    oidc:
      enabled: ${ROUTEMIND_OIDC_ENABLED:false}
      issuer: ${ROUTEMIND_OIDC_ISSUER:}
      audience: ${ROUTEMIND_OIDC_AUDIENCE:}
      jwk-set-uri: ${ROUTEMIND_OIDC_JWK_SET_URI:}
      roles-claim: ${ROUTEMIND_OIDC_ROLES_CLAIM:roles}
      tenant-claim: ${ROUTEMIND_OIDC_TENANT_CLAIM:tenant_id}
      allow-insecure-loopback: ${ROUTEMIND_OIDC_ALLOW_INSECURE_LOOPBACK:false}
  reconciliation:
    scheduler:
      enabled: ${ROUTEMIND_RECONCILIATION_ENABLED:true}
      initial-delay-ms: ${ROUTEMIND_RECONCILIATION_INITIAL_DELAY_MS:30000}
      fixed-delay-ms: ${ROUTEMIND_RECONCILIATION_DELAY_MS:60000}
  rabbit:
    publisher:
      enabled: ${ROUTEMIND_RABBIT_PUBLISHER_ENABLED:true}
  notification:
    email:
      # Gmail is the active provider candidate; live use remains disabled by default.
      provider: ${ROUTEMIND_NOTIFICATION_EMAIL_PROVIDER:gmail}
    gmail:
      enabled: ${ROUTEMIND_NOTIFICATION_GMAIL_ENABLED:false}
      region: ${ROUTEMIND_NOTIFICATION_GMAIL_REGION:global}
      client-secrets-path: ${ROUTEMIND_GMAIL_OAUTH_CLIENT_FILE:${ROUTEMIND_GMAIL_CLIENT_SECRETS_PATH:}}
      token-store-path: ${ROUTEMIND_GMAIL_TOKEN_STORE:${ROUTEMIND_GMAIL_TOKEN_STORE_PATH:}}
      oauth-user-id: ${ROUTEMIND_GMAIL_OAUTH_USER_ID:default}
      sender: ${ROUTEMIND_NOTIFICATION_SENDER:}
      synthetic-recipient: ${ROUTEMIND_NOTIFICATION_SYNTHETIC_RECIPIENT:}
