spring:
  application:
    name: business-api
  datasource:
    url: ${ROUTEMIND_POSTGRES_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:15432}/${POSTGRES_DB:routemind}}
    username: ${POSTGRES_USER:routemind}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  flyway:
    create-schemas: true
    default-schema: routemind
    schemas: routemind
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: routemind
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${BUSINESS_API_PORT:18080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
