spring:
  application:
    name: business-api
  datasource:
    url: ${ROUTEMIND_POSTGRES_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:15432}/${POSTGRES_DB:routemind}}
    username: ${POSTGRES_USER:routemind}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_AMQP_PORT:15673}
    username: ${RABBITMQ_DEFAULT_USER:routemind}
    password: ${RABBITMQ_DEFAULT_PASS:change-me-local-only}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:change-me-local-only}
  flyway:
    create-schemas: true
    default-schema: routemind
    schemas: routemind
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: routemind
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${BUSINESS_API_PORT:18080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [trace_id=%X{trace_id:-none} request_id=%X{request_id:-none}]"

routemind:
  rabbit:
    publisher:
      enabled: ${ROUTEMIND_RABBIT_PUBLISHER_ENABLED:true}
