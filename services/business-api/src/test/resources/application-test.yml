spring:
  datasource:
    url: jdbc:h2:mem:routemind;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

routemind:
  reconciliation:
    scheduler:
      enabled: false
  rabbit:
    publisher:
      enabled: false
  redis:
    projection:
      enabled: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false
