[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "routemind-compute-api"
version = "0.1.0"
description = "RouteMind stateless compute, optimization, and simulation runtime"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb==1.5.5",
    "fastapi==0.141.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "ortools==9.15.6755",
    "pydantic==2.13.4",
    "prometheus-client==0.24.1",
    "uvicorn==0.52.4",
]

[project.scripts]
routemind-compute-api = "routemind_compute.__main__:main"

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
required-version = "==0.12.5"

[tool.hatch.build.targets.wheel]
packages = ["src/routemind_compute"]

[tool.pytest.ini_options]
addopts = "--cov=routemind_compute --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["routemind_compute"]
